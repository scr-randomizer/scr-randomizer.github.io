name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Secrets and Verify
        env:
          EMBED: ${{ secrets.EMBED_SRC }}
          BADGE: ${{ secrets.V_BADGE }}
          ANALYTICS: ${{ secrets.ANALYTICS_SRC }}
          GIST: ${{ secrets.GIST_ID }}
        run: |
          # 1. Verify secrets presence
          if [ -z "$EMBED" ] || [ -z "$BADGE" ] || [ -z "$ANALYTICS" ] || [ -z "$GIST" ]; then
            echo "::error ::Missing one or more required secrets!"
            exit 1
          fi

          # 2. Setup clean dist folder
          rm -rf dist
          mkdir -p dist
          cp -r assets styles.css index.html dist/
          touch dist/.nojekyll

          if [ -f ".github/src/404.html" ]; then
            cp .github/src/404.html dist/404.html
          fi

          # 3. Export full GIST URL to the runner environment
          export GIST_FULL_URL="https://gist.githubusercontent.com/${{ github.repository_owner }}/${GIST}/raw/status.json"

          # 4. Strict Single-Quoted Perl Injections
          perl -pi -e 's|EMBED_PLACEHOLDER|$ENV{EMBED}|g' dist/index.html
          perl -pi -e 's|V_BADGE|$ENV{BADGE}|g' dist/index.html
          perl -pi -e 's|ANALYTICS_SRC|$ENV{ANALYTICS}|g' dist/index.html
          perl -pi -e 's|GIST_STATUS_URL|$ENV{GIST_FULL_URL}|g' dist/index.html

          sed -i "s|</body>|<!-- build: $(date +%s) --></body>|g" dist/index.html

          # 5. will fail build before deploy if anything was skipped
          if grep -E "EMBED_PLACEHOLDER|GIST_STATUS_URL" dist/index.html; then
            echo "::error ::Placeholder replacement check failed!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
