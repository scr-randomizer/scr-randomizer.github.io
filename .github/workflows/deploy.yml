name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Secrets and Verify
        env:
          EMBED: ${{ secrets.EMBED_SRC }}
          BADGE: ${{ secrets.V_BADGE }}
          ANALYTICS: ${{ secrets.ANALYTICS_SRC }}
          GIST: ${{ secrets.GIST_ID }}
        run: |
          # 1. Verify all secrets exist
          if [ -z "$EMBED" ] || [ -z "$BADGE" ] || [ -z "$ANALYTICS" ] || [ -z "$GIST" ]; then
            echo "::error ::One or more secrets (EMBED_SRC, V_BADGE, ANALYTICS_SRC, GIST_ID) are missing!"
            exit 1
          fi

          # 2. Build deployment folder
          mkdir -p dist
          cp -r assets styles.css index.html dist/
          touch dist/.nojekyll

          if [ -f ".github/src/404.html" ]; then
            cp .github/src/404.html dist/404.html
          fi

          # 3. Construct Raw Gist URL
          # If GIST_ID contains only the hash, we construct the full raw endpoint:
          GIST_URL="https://gist.githubusercontent.com/${{ github.repository_owner }}/${GIST}/raw/status.json"

          # 4. Inject secrets
          perl -pi -e "s|EMBED_PLACEHOLDER|\$ENV{EMBED}|g" dist/index.html
          perl -pi -e "s|V_BADGE|\$ENV{BADGE}|g" dist/index.html
          perl -pi -e "s|ANALYTICS_SRC|\$ENV{ANALYTICS}|g" dist/index.html
          perl -pi -e "s|GIST_STATUS_URL|${GIST_URL}|g" dist/index.html

          # 5. Verify injection
          if grep -q "GIST_STATUS_URL" dist/index.html; then
            echo "::error ::GIST_STATUS_URL replacement failed!"
            exit 1
          fi

          echo "=== SECRETS INJECTED SUCCESSFULLY ==="

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
