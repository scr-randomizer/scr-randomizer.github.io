<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/RNGfavicon.png">
    <title>SCR Randomizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="containerhead">
            <img src="assets/randomizerlogostatic.png" alt="SCR Randomizer" class="title-image">
            <p class="repo-link">
                Welcome! <b>Click the screen to start.</b> <br>
            </p>
        </div>
    </header>

    <div class="containerbody">
        <div id="live-view" style="display: none;">
            <div id="app-buffer">
                <iframe id="gateway" data-src="https://studio.code.org/projects/applab/test/embed" src="about:blank"></iframe>
            </div>
        </div>
        
        <div id="maint" style="display: none;">
            <div class="maintenance-wrapper">
                <div class="maintenance-container">
                    <p>This is currently under maintenance. As this site is currently a work in progress, this feature is currently unavailable. Please try again later to access site features. I apologize for the inconvenience.</p>
                </div>
            </div>
        </div>
    </div>

    <p class="footer-text">
        Have issues/suggestions? Please create an 
        <a href="https://github.com/scr-randomizer/scr-randomizer.github.io/issues" style="color: #FFFFFF;">issue request</a>!
    </p>

    <div class="footer-logo">
        <a href="https://ko-fi.com/R6R71RH2ZF" target="_blank" rel="noopener">
            <img height="44px" src="https://storage.ko-fi.com/cdn/kofi5.png?v=6" alt="Buy Me a Coffee">
        </a>
    </div>

    <div class="footer-status">    
        <a href="https://github.com/scr-randomizer/home/" target="_blank" rel="noopener">
            <img src="https://img.shields.io/badge/github-repo-2facf9?logo=github" alt="GitHub Repository">
        </a> 
        <a href="https://github.com/scr-randomizer/home/" target="_blank" rel="noopener">
            <img id="visits-badge" src="https://visitor-badge.laobi.icu/badge?page_id=test" alt="Visits" style="display: inline-block; vertical-align: middle;">
        </a>
    </div>

    <script data-goatcounter="https://test.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <!-- ===== Dynamic Gist Site Status Check ===== -->
    <script>
    (function() {
        var appView = document.getElementById('live-view');
        var maintenanceView = document.getElementById('maint');
        var frame = document.getElementById('gateway');
        var visitsBadge = document.getElementById('visits-badge');

        var STATUS_URL = "https://gist.githubusercontent.com/test/raw/status.json";

        function setDisplay(isLive) {
            if (isLive) {
                appView.style.display = 'block';
                maintenanceView.style.display = 'none';
                if (frame.src === "about:blank" || !frame.src) {
                    frame.src = frame.getAttribute('data-src');
                }
            } else {
                appView.style.display = 'none';
                maintenanceView.style.display = 'block';
                frame.src = "about:blank";
            }

            // Keep Visits badge visible in maintenance mode
            if (visitsBadge) {
                visitsBadge.style.display = 'inline-block';
            }
        }

        // Run immediately on page load
        if (window.self !== window.top) {
            return;
        }

        // If status URL wasn't injected during build, default safely
        if (!STATUS_URL || STATUS_URL.indexOf("https://gist.githubusercontent.com/test/raw/status.json") !== -1) {
            setDisplay(true);
            return;
        }

        fetch(STATUS_URL + "?t=" + Date.now(), { cache: "no-store" })
            .then(function(res) {
                if (!res.ok) throw new Error("Status endpoint HTTP " + res.status);
                return res.json();
            })
            .then(function(data) {
                setDisplay(Boolean(data.live));
            })
            .catch(function(err) {
                console.warn("Status check failed, defaulting to online:", err);
                setDisplay(true);
            });
    })();
    </script>
</body>
</html>
